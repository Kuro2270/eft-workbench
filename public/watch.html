<html lang="ja">

<style>
:root{
  --bg:#1E2528; --panel:#263034; --line:#3A474C; --text:#E3DDD0; --muted:#98A29F;
  --tan:#C9A66B; --gain:#8DBF6A; --loss:#D0654A; --warn:#E0B44C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:14px;line-height:1.55}
/* ヘッダー：左（サイト名・モード）の幅を固定し、どのページでもツールのボタンが同じ位置に来るようにする */
header{padding:14px 20px 12px;border-bottom:2px solid var(--tan);display:grid;grid-template-columns:auto 1fr auto;gap:10px 24px;align-items:center}
header .hl{display:flex;align-items:center;gap:12px;min-width:0}
header .brand{color:var(--tan);text-decoration:none;font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap}
header #modeSel{width:auto}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:0 0 10px}
.phead h1{margin:0;font-size:22px;letter-spacing:.02em}
.phead .status{color:var(--muted);font-size:13px}
main{padding:14px 20px 40px;max-width:1400px}
button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px}
button{cursor:pointer}
button.primary{background:var(--tan);color:#1E2528;border-color:var(--tan);font-weight:700}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
details.settings{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:14px}
details.settings summary{cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;margin-top:10px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.grid input,.grid select{width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--tan);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.note{color:var(--muted);font-size:12px}
.banner{border-left:4px solid var(--warn);background:#2E2A1E;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:980px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--panel);position:sticky;top:0;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th[data-sorted]::after{content:attr(data-sorted);color:var(--tan)}
tr:hover td{background:#243035}
td.item{display:flex;gap:8px;align-items:center;min-width:220px;white-space:normal}
td.item img{width:36px;height:36px;object-fit:contain;background:#151B1D;border-radius:3px;flex:none}
td.item a{color:var(--text);text-decoration:none}
td.item a:hover{text-decoration:underline}
.copy{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;padding:0;margin:0 4px;vertical-align:-3px;border-radius:3px;color:var(--muted)}
.copy:hover{color:var(--text);border-color:var(--tan)}
.copy.done{color:#1E2528;background:var(--gain);border-color:var(--gain)}
.copy.fail{color:#1E2528;background:var(--loss);border-color:var(--loss)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{border:none;border-radius:0;padding:3px 10px;font-size:12px;color:var(--muted);background:none}
.lang button[aria-pressed="true"]{background:var(--tan);color:#1E2528;font-weight:700}
.sub{display:block;color:var(--muted);font-size:11px}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted)}
.tag.need{border-color:#5E7A5A;color:#A9C79A}
td.liq{white-space:normal;min-width:170px}
.sub.mats{white-space:normal;max-width:420px}
td.liq .sub{margin-top:2px}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.hides label{margin-left:9px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.hides input{vertical-align:-2px;accent-color:var(--tan)}
.tier{display:inline-block;min-width:26px;text-align:center;font-weight:700;border-radius:3px;padding:1px 5px;color:#1E2528}
.tier.S{background:#E0B44C} .tier.A{background:#8DBF6A} .tier.B{background:#7FA8C9}
.tier.C{background:#98A29F} .tier.D{background:#5A6468;color:#C9CFCD}
.opp{display:inline-flex;align-items:center;gap:6px}
.opp i{display:inline-block;width:54px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.opp i b{display:block;height:100%;background:var(--gain)}
svg.spark{display:block}
[hidden]{display:none !important}
.pages{display:flex;flex-wrap:wrap;gap:6px}
.pages a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:3px 10px}
.pages a[aria-current="page"]{color:#1E2528;background:var(--tan);border-color:var(--tan);font-weight:700}
#tierBoard{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;align-items:stretch}
.tlab{flex:0 0 112px;border-radius:4px;padding:8px 6px;color:#1E2528;text-align:center;display:flex;flex-direction:column;justify-content:center}
.tlab b{font-size:30px;line-height:1.1}.tlab small{font-size:11px;font-weight:400;line-height:1.3}
.tlab.S{background:#E0B44C}.tlab.A{background:#8DBF6A}.tlab.B{background:#7FA8C9}.tlab.C{background:#98A29F}.tlab.D{background:#5A6468;color:#E3DDD0}
.ticons{flex:1;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px;min-height:78px;align-content:flex-start}
.ti{width:64px;height:64px;background:#1A2124;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;line-height:1.2;text-align:center;color:var(--muted);text-decoration:none;word-break:break-all}
.ti img{max-width:100%;max-height:100%;object-fit:contain}
.ti:hover,.ti:focus{outline:2px solid var(--tan);outline-offset:1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#12181A;border:1px solid var(--tan);border-radius:4px;padding:8px 11px;font-size:12.5px;line-height:1.55;max-width:320px;box-shadow:0 4px 16px #0009}
#tip b.n{display:block;font-size:13.5px;margin-bottom:2px}
#tip .k{color:var(--muted)}
#marketPanel{margin:0 0 10px}
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:12px}
.mbar input[type=number]{width:4.6em}
.note.ok{color:var(--gain)} .note.warn{color:var(--warn)}
.msec{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:12px;overflow-x:auto}
.msec h2{font-size:15px;margin:0 0 2px} .msec h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.msec.buy h2{color:#7FA8C9} .msec.sell h2{color:var(--gain)}
.mtbl{width:100%;border-collapse:collapse;font-size:13px}
.mtbl th,.mtbl td{padding:5px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.mtbl th{color:var(--muted);font-weight:400;border-top:0}
.mtbl .l{text-align:left}
.mtbl tr.mrow{cursor:pointer} .mtbl tr.mrow:hover td{background:#ffffff08}
.mtbl tr.mrow.open td{background:#ffffff0d}
.wico{display:inline-flex;width:28px;height:28px;vertical-align:middle;margin-right:6px;align-items:center;justify-content:center}
.wico img{max-width:100%;max-height:100%}
.mrec b{font-size:14px} .msec.buy .mrec b{color:#7FA8C9} .msec.sell .mrec b{color:var(--gain)}
.mtag{display:inline-block;border-radius:3px;padding:0 6px;font-size:12px;margin-left:6px;color:#1E2528;font-weight:700}
.mtag.buy{background:#7FA8C9} .mtag.sell{background:var(--gain)}
.mprofit b{color:var(--gain);font-size:14px}
.mtag.held{background:var(--tan)}
.sadd{margin-left:8px;padding:1px 8px;font-size:12px}
.sform{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
#stockDlg{position:fixed;z-index:60;left:50%;top:24px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--tan);border-radius:6px;padding:14px 18px;box-shadow:0 8px 28px #000c;max-width:calc(100vw - 32px)}
.msec.stock{border-color:var(--tan)} .msec.stock h2{color:var(--tan)}
.ssell{margin:4px 0;color:#1E2528;background:var(--gain);display:inline-block;border-radius:3px;padding:1px 10px;font-weight:700}
.sstate{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
.s-sell .sstate{background:var(--gain);border-color:var(--gain);color:#1E2528;font-weight:700}
.s-sell td{background:#8DBF6A14}
.s-plus .sstate{border-color:var(--gain);color:var(--gain)}
.s-high .sstate{border-color:var(--warn);color:var(--warn)}
.spl b.gain{color:var(--gain)} .spl b.loss{color:var(--loss)}
.mrange{display:inline-block;position:relative;width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,#7FA8C9 0 25%,var(--line) 25% 75%,var(--gain) 75% 100%);vertical-align:middle;opacity:.9}
.mrange i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#E3DDD0;box-shadow:0 0 0 2px var(--panel)}
.mrangeL{display:flex;justify-content:space-between;width:140px;margin-left:auto;font-size:11px;color:var(--muted)}
.mdetail td{padding:8px 8px 12px;text-align:left;white-space:normal}
.mdetail .mtext{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:6px}
svg.wchart{display:block;cursor:crosshair;max-width:100%}
svg.wchart .dot{fill:var(--muted);opacity:.55}
svg.wchart .ma-short{fill:none;stroke:var(--tan);stroke-width:2;stroke-linejoin:round}
svg.wchart .ma-long{fill:none;stroke:#E3DDD0;stroke-width:2;stroke-dasharray:4 3;opacity:.7}
svg.wchart .ref-buy{stroke:#7FA8C9;stroke-width:1.5;stroke-dasharray:2 3}
svg.wchart .ref-sell{stroke:var(--gain);stroke-width:1.5;stroke-dasharray:2 3}
svg.wchart text{font-size:10px;fill:var(--muted)}
svg.wchart .cross{stroke:var(--muted);stroke-width:1}
.wleg{font-weight:400;font-size:11.5px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--muted)}
.wleg i{display:inline-block;width:16px;height:0;margin-right:4px;vertical-align:middle}
.wleg i.ls{border-top:2px solid var(--tan)} .wleg i.ll{border-top:2px dashed #E3DDD0} .wleg i.ld{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.wleg i.lb{border-top:2px dotted #7FA8C9} .wleg i.lh{border-top:2px dotted var(--gain)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:8px 0 18px}
.cards .lead{grid-column:1/-1;margin:0 0 4px;color:var(--muted)}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;color:inherit;text-decoration:none}
.card b{font-size:17px;color:var(--tan)}
.card span{color:var(--muted);font-size:13px;line-height:1.6}
.card:hover,.card:focus{border-color:var(--tan)}
.card.sub b{color:inherit}
.setline a{color:var(--tan)}
footer{padding:16px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
footer a{color:var(--muted)}
@media (max-width:900px){header{grid-template-columns:1fr auto}header .pages{grid-column:1 / -1;grid-row:2}}
@media (max-width:600px){header .hl{display:contents}header .brand{grid-column:1;grid-row:1}header .lang{grid-column:2;grid-row:1}header #modeSel{grid-column:1 / -1;grid-row:2;justify-self:start}header .pages{grid-row:3}}
@media (max-width:700px){header,main{padding-left:10px;padding-right:10px}}
</style>
</head>

  <div class="tabs" role="tablist">

  <div id="banner"></div>

  <div id="tierBoard" hidden></div>
  <div class="tablewrap" id="listWrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>

</main>
<footer id="footer"></footer>
<div id="tip" hidden></div>

function migrate(s){
  if(!s._lmo10){ s.lootMinOffers = 10; s._lmo10 = true; }   // 出品数の既定値を3→10にした（初回だけ切り替える）
  if(s.hideLowLiq && !s.liqFilter) s.liqFilter = "mid";
  if(s.lootKeys !== undefined && s.hideLootKeys === undefined) s.hideLootKeys = s.lootKeys !== "show";
  /* 持ち帰りティア表の「一覧に表示」のチェック（品の種類ごと）を、分類（lootOff）に置き換えた */
  const OLD_HIDE = {hideLootKeys: "keys", hideLootArmor: "armor", hideLootMods: "mods", hideLootHelmets: "helmet", hideLootGuns: "gun", hideLootPosters: "poster", hideLootHeadsets: "headset", hideLootBalaclava: "face", hideLootWearables: "wear"};
  if(!Array.isArray(s.lootOff) && Object.keys(OLD_HIDE).some(k => k in s)) s.lootOff = Object.keys(OLD_HIDE).filter(k => s[k]).map(k => OLD_HIDE[k]);
  for(const k of [...Object.keys(OLD_HIDE), "hideLootVariants"]) delete s[k];
  if(Array.isArray(s.lootOff)) s.lootOff = s.lootOff.filter(k => ["barter", "meds", "provisions", "ammoBox", "grenade", "keys"].includes(k));   // 選べなくなった分類は消す
  delete s.hideLowLiq; delete s.keyMode; delete s.lootKeys;
  return s;
}

  try{ const s = JSON.parse(localStorage.getItem("eftflip.settings") || "null"); if(s && migrate(s)) return {...DEFAULTS, ...s, ll:{...DEFAULTS.ll, ...(s.ll||{})}}; }catch(e){}
  return structuredClone(DEFAULTS);
}

  const sel = (key,label,opts) => `<label>${label}<select data-k="${key}">${opts.map(([v,l]) => `<option value="${v}" ${String(S[key]) === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;

const JSON_API = "https://json.tarkov.dev/";
async function getJson(path, stepKey){
  const step = t("stepNames")[stepKey] || stepKey;
  let r;
  try{
    r = await fetch(JSON_API + S.mode + "/" + path, {cache: "no-cache", headers: {Accept: "application/json"}, signal: AbortSignal.timeout(90000)});
  }catch(e){
    throw new Error(t("netErr", {step, why: e.name === "TimeoutError" ? t("timeout") : e.message}));
  }
  if(!r.ok) throw new Error(t("httpErr", {step, status: r.status}));
  return (await r.json()).data;
}

function buildDemand(tasks, hideout, barters, crafts){

    d[kind] += n || 1; m.set(id, d);
  };
  const vals = x => !x ? [] : Array.isArray(x) ? x : Object.values(x);
  // クエスト納品：フリマやトレーダーで買った品（FIRでない品）でも納品できるものだけ数える
  for(const tk of vals(tasks && tasks.tasks)){
    for(const o of tk.objectives || []){
      if(o.type !== "giveItem" || o.foundInRaid) continue;
      const ids = o.items || (o.item ? [o.item] : []);
      for(const id of ids) add(typeof id === "object" ? id.id : id, "quest", o.count);
    }
  }
  for(const st of vals(hideout)) for(const lv of st.levels || []) for(const r of lv.itemRequirements || []) add(r.item, "hideout", r.count);
  for(const c of vals(crafts)) for(const r of c.requiredItems || []) add(r.item, "craft", r.count);
  return m;
}

/* 1マスに何個まとまるか。弾薬だけはデータに入っている */
function stackSize(pr){
  return pr && pr.propertiesType === "ItemPropertiesAmmo" && pr.stackMaxSize > 1 ? pr.stackMaxSize : 1;
}
/* 残量（使用回数・HP・燃料など）がある品。フリマの最安値は使いかけの出品であることが多い */
function depletable(pr){
  if(!pr) return null;
  switch(pr.propertiesType){
    case "ItemPropertiesKey": return pr.uses > 1 ? {kind: "uses", max: pr.uses} : null;
    case "ItemPropertiesMedicalItem": case "ItemPropertiesPainkiller": return pr.uses > 1 ? {kind: "uses", max: pr.uses} : null;
    case "ItemPropertiesMedKit": return pr.hitpoints > 1 ? {kind: "hp", max: pr.hitpoints} : null;
    case "ItemPropertiesResource": return pr.units > 1 ? {kind: "res", max: pr.units} : null;
  }
  return null;
}

/* 生データ → 保存できる形（JSON にそのまま書ける。バーターは品物を ID で持つ） */
function buildData(raw){
  const {items, itemsJa, itemsEn, traders, tradersJa, tradersEn, tasks, hideout, barters, crafts} = raw;
  const demand = buildDemand(tasks, hideout, barters, crafts);
  const T = {};
  for(const [id, tt] of Object.entries(traders)){
    T[id] = {name: {ja: tr(tt.name, tradersJa, tradersEn), en: tr(tt.name, tradersEn, tradersJa)}, normalizedName: tt.normalizedName};
  }
  const list = Object.values(items.items).map(raw => ({
    id: raw.id,
    name: {ja: tr(raw.name, itemsJa, itemsEn), en: tr(raw.name, itemsEn)},
    shortName: {ja: tr(raw.shortName, itemsJa, itemsEn), en: tr(raw.shortName, itemsEn)},
    iconLink: raw.iconLink, link: raw.link, width: raw.width, height: raw.height, basePrice: raw.basePrice, types: raw.types || [],
    avg24hPrice: raw.avg24hPrice, lastLowPrice: raw.lastLowPrice, low24hPrice: raw.low24hPrice, high24hPrice: raw.high24hPrice,
    updated: raw.updated ? (Date.parse(raw.updated) || 0) : 0,     // フリマ価格を最後に読み取った時刻（売り時通知で「今」の値に使う）
    lastOfferCount: raw.lastOfferCount, changeLast48hPercent: raw.changeLast48hPercent, minLevelForFlea: raw.minLevelForFlea,
    sellFor: (raw.sellToTrader || []).filter(o => T[o.trader]).map(o => ({priceRUB: o.priceRUB, vendor: {name: T[o.trader].name, normalizedName: T[o.trader].normalizedName}})),
    buyFor: (raw.buyFromTrader || []).filter(o => T[o.trader]).map(o => ({priceRUB: o.priceRUB, vendor: {
      name: T[o.trader].name, normalizedName: T[o.trader].normalizedName, trader: {normalizedName: T[o.trader].normalizedName},
      minTraderLevel: o.minTraderLevel, buyLimit: o.buyLimit, restockAmount: o.restockAmount, taskUnlock: !!o.taskUnlock}})),
    demand: demand.get(raw.id) || null,
    depl: depletable(raw.properties),
    melee: !!(raw.properties && raw.properties.propertiesType === "ItemPropertiesMelee"),
    pt: (raw.properties && raw.properties.propertiesType) || "",
    cats: [raw.category, ...(raw.categories || []), ...(raw.handbookCategories || [])].filter(Boolean).map(c => String(c.normalizedName || c.name || c.id || c).toLowerCase()),
    stack: stackSize(raw.properties),
    /* 弾薬箱の中身（弾の ID と数）。箱のままより、開けて弾を売るほうが高いことが多い。ほかの品は持たない（保存データを小さくするため） */
    contains: (raw.types || []).includes("ammoBox")
      ? (raw.containsItems || []).map(c => ({id: typeof c.item === "string" ? c.item : (c.item && c.item.id), count: c.count || 1})).filter(c => c.id)
      : undefined,
  }));
  const ids = new Set(list.map(it => it.id));
  const bartersList = (Array.isArray(barters) ? barters : barters ? Object.values(barters) : []).map(b => {
    const rw = b.offeredItem || (b.rewardItems || [])[0];
    const reqs = (b.requiredItems || []).map(r => ({id: r.item, count: r.count || 1, special: r.attributes && Object.keys(r.attributes).length > 0}));
    if(!rw || !ids.has(rw.item) || !T[b.trader] || !reqs.length || reqs.some(r => !ids.has(r.id) || r.special)) return null;   // 条件付き材料（ドッグタグのレベル指定など）は対象外
    return {id: b.id, trader: T[b.trader], ll: b.minTraderLevel || 1, task: !!b.taskUnlock, limit: b.buyLimit || 0,
            rewardId: rw.item, rewardCount: rw.count || 1, reqs: reqs.map(r => ({id: r.id, count: r.count}))};
  }).filter(Boolean);
  return {v: SNAPSHOT_VERSION, items: list, flea: items.fleaMarket, barters: bartersList};
}

/* 保存できる形 → 画面で使う形（バーターの ID を品物そのものにつなぐ） */
function hydrateData(d){
  const byId = new Map(d.items.map(it => [it.id, it]));
  const barters = d.barters.map(b => ({id: b.id, trader: b.trader, ll: b.ll, task: b.task, limit: b.limit,
    reward: byId.get(b.rewardId), rewardCount: b.rewardCount, reqs: b.reqs.map(r => ({it: byId.get(r.id), count: r.count, special: false}))}))
    .filter(b => b.reward && b.reqs.every(r => r.it));
  return {items: d.items, flea: d.flea, barters};
}

/* ================= 売り時・買い時：相場の位置の計算（計算だけ。画面・取得には触れない） =================
   考え方
   ・値段は、価格記録の「平均価格」（その時点の安い出品いくつかの平均。tarkov.dev のグラフの実線）を使う。
     「最安値」は、すぐ買われる極端に安い1件を拾うことがあり、実際に買える値段とずれるため（平均価格が無い記録だけ最安値で代用）
   ・品ごとの価格記録（prices/<id>）から、過去 N 日（既定30日）の値動きの幅を出す。
     最安値は1件の出品で跳ねるので、幅の両端は「下から5%」「上から5%」の値を使う（極端な1点に引っぱられない）
   ・いまの最安値がその幅のどこにあるか（位置 0%＝底値、100%＝高値）で、買い場・売り場を決める
     位置 20%以下＝底値付近（買い場）、80%以上＝高値付近（売り場）
   ・おすすめの値段：買うなら「下から25%」の値以下、売るなら「上から25%」の値以上
     （過去 N 日のうち、4分の3の時間はそれより高かった／安かった、という値）
   ・グラフ用に、24時間と7日の移動平均（跳ねた値を外した平均）も出す */

const HOUR = 3600e3, DAY = 24 * HOUR;
const MA_SHORT = DAY, MA_LONG = 7 * DAY;     // 短期線・長期線の幅
const MIN_SHORT = 3, MIN_LONG = 10;          // 平均を出すのに要る最低の記録数
const MIN_RANGE = 10;                        // 幅を出すのに要る最低の記録数
const ZONE = 0.2;                            // 底値付近・高値付近とみなす位置（下から／上から20%）

/* 価格記録 → 時刻順の点（平均価格。無ければ最安値。どちらも0の点は捨てる）。from より前は使わない */
function pricePoints(hist, from){
  const tsOf = p => isNaN(+p.timestamp) ? Date.parse(p.timestamp) : +p.timestamp;
  return (hist || []).map(p => ({t: tsOf(p), price: p.price > 0 ? p.price : p.priceMin, min: p.priceMin || 0, offers: p.offerCount || 0}))
                     .filter(p => p.price > 0 && p.t >= from).sort((a, b) => a.t - b.t);
}
const CUR_SCANS = 3;                         // 「いまの相場」＝直近3回の読み取りの中央値
const ODD_LOW = 0.8;                         // 一覧の最安値が相場の80%未満なら「極端に安い出品」とみなす
/* 並べ替え済みの配列の q 分位点（0〜1） */
function quantile(sorted, q){
  if(!sorted.length) return null;
  const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
/* 時刻 t までの width 幅の移動平均（記録が min 件に足りなければ null）。
   その幅の中央値から ±30% を超える値は外してから平均する */
const OUTLIER = 0.3;
function movingAvg(pts, t, width, min){
  const vals = [];
  for(const p of pts){ if(p.t > t - width && p.t <= t) vals.push(p.price); }
  if(vals.length < (min || 1)) return null;
  const med = quantile([...vals].sort((a, b) => a - b), 0.5);
  const kept = vals.filter(v => Math.abs(v - med) <= med * OUTLIER);
  return kept.reduce((a, b) => a + b, 0) / kept.length;
}
/* グラフ用：from〜to を step ごとに区切った短期線・長期線 */
function trendLines(pts, from, to, step){
  const out = [];
  for(let t = from; t <= to; t += step){
    out.push({t, short: movingAvg(pts, t, MA_SHORT, MIN_SHORT), long: movingAvg(pts, t, MA_LONG, MIN_LONG)});
  }
  return out;
}
/* いまの値段の、過去 days 日の中での位置。
   live = {price, at}：アイテム一覧の最新の最安値（価格記録の最後より新しければ「いま」として使う） */
function marketView(hist, opt){
  const now = opt.now || Date.now(), days = opt.days || 30;
  const all = pricePoints(hist, now - Math.max(days, 14) * DAY);
  const pts = all.filter(p => p.t >= now - days * DAY);
  if(pts.length < MIN_RANGE) return {zone: "few", n: pts.length, pts: all};
  const sorted = pts.map(p => p.price).sort((a, b) => a - b);
  const low = quantile(sorted, 0.05), high = quantile(sorted, 0.95);
  const buyAt = quantile(sorted, 0.25), sellAt = quantile(sorted, 0.75), median = quantile(sorted, 0.5);
  /* いまの相場：直近3回の読み取りの中央値（1回だけの外れに引っぱられない）。
     一覧の最安値（live）は、相場より極端に安ければ「すぐ売り切れる安い出品」として別に知らせるだけにする */
  const recent = pts.slice(-CUR_SCANS);
  const cur = {price: quantile(recent.map(p => p.price).sort((a, b) => a - b), 0.5), t: recent[recent.length - 1].t};
  const lv = opt.live;
  const oddLow = lv && lv.price > 0 && lv.price < cur.price * ODD_LOW ? {price: lv.price, at: lv.at} : null;
  const pos = high > low ? Math.min(1, Math.max(0, (cur.price - low) / (high - low))) : 0.5;
  const zone = pos <= ZONE ? "buy" : pos >= 1 - ZONE ? "sell" : "mid";
  const short = movingAvg(all, now, MA_SHORT, MIN_SHORT), long = movingAvg(all, now, MA_LONG, MIN_LONG);
  const rb = rebounds(all, now - days * DAY, now, buyAt, sellAt);
  return {zone, pos, price: cur.price, at: cur.t, oddLow, low, high, buyAt, sellAt, median, short, long,
          trend: short != null && long != null ? short / long - 1 : null, rebounds: rb.count, recentHigh: rb.high, n: pts.length, pts: all};
}
/* 「底値から、おすすめ売値まで戻った」回数（往復の回数）。
   24時間平均（グラフの実線）を期間の頭から順に見て、おすすめ買値以下まで下がったあとに、
   おすすめ売値以上まで戻ったら1回と数える。一度高値から落ちて、そのまま戻っていない品は 0 回になる
   （ワイプ後に使い道が減って値崩れし続けている品など）。
   1回の跳ねた読み取りや、1日の中の上下では数えないよう、24時間平均で見る */
function rebounds(pts, from, to, buyAt, sellAt){
  let count = 0, wasLow = false, high = 0, lastLowAt = 0;
  for(let t = from; t <= to; t += 2 * HOUR){
    const ma = movingAvg(pts, t, MA_SHORT, MIN_SHORT);
    if(ma == null) continue;
    if(ma <= buyAt){ wasLow = true; lastLowAt = t; high = 0; }
    else if(wasLow) high = Math.max(high, ma);               // 底値を付けたあとの最高値
    if(wasLow && ma >= sellAt){ count++; wasLow = false; }
  }
  return {count, high};
}
/* 底値付近で買って、おすすめ売値（上から25%の値）で売ったときの見込み利益。
   売り先はフリマ（手数料を引いた手取り）とトレーダー（その場で売れる額）の高いほう。買うのはフリマの今の最安値（手数料なし） */
function buyProfit(buyPrice, sellAt, feeOf, traderPrice){
  const fleaNet = sellAt - feeOf(sellAt);
  const viaTrader = (traderPrice || 0) > fleaNet;
  const sellNet = viaTrader ? traderPrice : fleaNet;
  const profit = sellNet - buyPrice;
  return {sellNet, via: viaTrader ? "trader" : "flea", profit, rate: buyPrice > 0 ? profit / buyPrice : 0};
}
/* 在庫（仕込んだ品）の状態。v＝marketView の結果、cost＝1個あたりの買値、netNow＝いま売ったときの1個あたりの手取り
   sell：売り場（高値付近か、おすすめ売値に届いた）で、売れば利益が出る／high：高値付近だが、買値が高く売ると赤字／plus：売れば利益は出るが、まだ上がる余地あり／hold：待ち／few：判定できない */
function stockState(v, cost, netNow){
  if(!v || v.zone === "few") return "few";
  if(v.zone === "sell" || v.price >= v.sellAt) return netNow >= cost ? "sell" : "high";
  if(netNow > cost) return "plus";
  return "hold";
}
/* 一覧の段階で候補を絞るための目安：いまの最安値が24時間平均より何%高い（安い）か。
   全品の価格記録は取れないので、まずこれで候補を選び、候補だけ記録を取って位置を確かめる */
function quickDev(it){
  return it.avg24hPrice > 0 && it.lastLowPrice > 0 ? it.lastLowPrice / it.avg24hPrice - 1 : null;
}
/* 候補にするか：いまの最安値が24時間平均より th 以上安い（高い）か、48時間で th 以上下がった（上がった）品。
   side = "buy"（安い側）／"sell"（高い側）。th は 0.05 なら 5%。返り値は外れ具合（並べ替え用、大きいほど外れている）。対象外なら null */
function candScore(it, side, th){
  const dev = quickDev(it), ch = it.changeLast48hPercent != null ? it.changeLast48hPercent / 100 : null;
  const vals = [dev, ch].filter(v => v != null).map(v => side === "buy" ? -v : v);
  if(!vals.length) return null;
  const best = Math.max(...vals);
  return best >= th ? best : null;
}

/* 値段の更新がこまめな品か。データを取った時刻（refAt）の時点で、最安値の読み取りが maxMin 分以内だった品 */
function isFresh(updatedAt, refAt, maxMin){
  return updatedAt > 0 && refAt - updatedAt <= maxMin * 60000;
}


/* その場で tarkov.dev から取る（サーバーに保存データが無いときだけ） */
async function loadAll(onStep){
  onStep(t("stepItems"));
  const got = await Promise.all(RAW_PATHS.map(r => getJson(r.path, r.path).catch(err => { if(!r.soft) throw err; console.warn(err); return null; })));
  return hydrateData(buildData(Object.fromEntries(RAW_PATHS.map((r, i) => [r.key, got[i]]))));
}
/* サーバーに置いた保存データ（data/<モード>.json）を読む。無い・古い形式なら null */
async function loadSnapshot(mode){
  try{
    const r = await fetch(`data/${mode}.json`, {cache: "no-cache"});
    if(!r.ok) return null;
    const d = await r.json();
    if(!d || d.v !== SNAPSHOT_VERSION || !Array.isArray(d.items)) return null;
    return {...hydrateData(d), at: new Date(d.at)};
  }catch(e){ return null; }
}
const nm = o => o ? (o[S.lang] || o.ja || o.en || "") : "";

/* ================= 計算（tarkov.dev と同じ手数料式） ================= */
function fleaFee(basePrice, price, flea){
  if(!price || !basePrice) return 0;
  const vo = basePrice, vr = price;
  let po = Math.log10(vo / vr); if(vr < vo) po = Math.pow(po, 1.08);
  let pr = Math.log10(vr / vo); if(vr >= vo) pr = Math.pow(pr, 1.08);
  let fee = vo * flea.sellOfferFeeRate * Math.pow(4, po) + vr * flea.sellRequirementFeeRate * Math.pow(4, pr);
  if(S.intel >= 3){ const d = 0.3 + 0.3 * S.mgmt * 0.01; fee -= fee * d; }
  return Math.round(fee);
}
/* 銃本体とプリセット。
   tarkov.dev は、銃のフリマ価格に「その銃の組み立て済み（プリセット）の出品」も混ぜて、
   いちばん安いものを本体の最安値としている（update-flea-prices.mjs の
   「we need to add preset prices back into the base weapon」）。
   一方トレーダーが売るのは素の本体なので、この2つを引き算しても実際には取れない利益になる。
   例：素のHK416A5をトレーダーで₽27,250 → フリマ最安は組み立て済みの₽69,696、という並び方をする。 */
const isGun = it => it.types.includes("gun") || it.types.includes("preset");

function fleaUsable(it){
  if(S.weapons === "exclude" && isGun(it)) return false;
  return !it.types.includes("noFlea") && it.lastLowPrice > 0 && (it.minLevelForFlea || 0) <= S.playerLevel;
}
function bestTraderSell(it){
  let best = null;
  for(const p of it.sellFor || []){
    const v = p.vendor.normalizedName;
    if(v === "flea-market" || !p.priceRUB) continue;
    if(S.excludeFence && v === "fence") continue;
    if(!best || p.priceRUB > best.priceRUB) best = p;
  }
  return best;
}
function cheapestTraderBuy(it){
  let best = null;
  for(const p of it.buyFor || []){
    const v = p.vendor;
    if(v.normalizedName === "flea-market" || !v.trader || !p.priceRUB) continue;
    const tn = v.trader.normalizedName;
    if((v.minTraderLevel || 1) > (S.ll[tn] || 4)) continue;
    if(S.hideTaskLocked && v.taskUnlock) continue;
    if(!best || p.priceRUB < best.priceRUB) best = p;
  }
  return best;
}

/* 1回の補充で実際に買える数。
   buyLimit は「あなたが買える上限」で、制限が無い品は 0 で返ってくる。
   restockAmount は「トレーダーが並べる在庫数」。どちらも効くので、小さいほうが実際の上限になる。
   以前は buyLimit だけを見ていたため、無制限に買える品の想定総利益が空欄になり、
   いちばん稼げるはずの品が並べ替えで最下位に沈んでいた。 */
function buyCap(v){
  const lim = +v.buyLimit || 0, stock = +v.restockAmount || 0;
  if(lim && stock) return {n: Math.min(lim, stock), by: lim <= stock ? "limit" : "stock"};
  if(lim) return {n: lim, by: "limit"};
  if(stock) return {n: stock, by: "stock"};
  return {n: 0, by: null};
}
/* 手数料を引いても原価（＋最低利益）が残る、いちばん安い売値。
   手数料は売値が上がるほど重くなるので、二分法で求める */
function breakEvenPrice(basePrice, cost, flea){
  if(!(cost > 0)) return 0;
  let lo = cost, hi = cost * 8 + 1000;
  const f = p => p - fleaFee(basePrice, p, flea) - cost;
  if(f(hi) < 0) return Infinity;
  for(let i = 0; i < 50; i++){ const m = (lo + hi) / 2; if(f(m) < 0) lo = m; else hi = m; }
  return Math.round((lo + hi) / 2);
}

function rowsF2T(){
  const out = [];
  for(const it of DATA.items){
    if(!fleaUsable(it)) continue;
    if(it.depl && S.depletableF2T === "exclude") continue;
    const sell = bestTraderSell(it); if(!sell) continue;
    const buy = it.lastLowPrice, profit = sell.priceRUB - buy;
    if(profit < S.minProfit || (it.lastOfferCount || 0) < S.minOffers) continue;
    // 使用回数のある鍵：最安の出品が「残り1回」だった場合、トレーダー買取額は残り回数に比例して下がる想定
    const worst = it.depl && it.depl.kind === "uses" ? Math.round(sell.priceRUB / it.depl.max) - buy : null;
    // この値段以下で買えれば最低利益が残る、という上限。グラフの線と帯に使う
    out.push({it, buy, sellPrice: sell.priceRUB, sellTo: sell.vendor.name, profit, worst,
              line: sell.priceRUB - S.minProfit, dir: "max"});
  }
  return out;
}
function rowsT2F(){
  const out = [];
  for(const it of DATA.items){
    if(!fleaUsable(it)) continue;
    const b = cheapestTraderBuy(it); if(!b) continue;
    const sellPrice = it.lastLowPrice - 1;
    const fee = fleaFee(it.basePrice, sellPrice, DATA.flea);
    const profit = sellPrice - fee - b.priceRUB;
    if(profit < S.minProfit || (it.lastOfferCount || 0) < S.minOffers) continue;
    const cap = buyCap(b.vendor);
    out.push({it, buy: b.priceRUB, buyFrom: b.vendor.name, ll: b.vendor.minTraderLevel, limit: cap.n, capBy: cap.by,
              task: b.vendor.taskUnlock, sellPrice, fee, profit,
              line: breakEvenPrice(it.basePrice, b.priceRUB + S.minProfit, DATA.flea), dir: "min"});
  }
  return out;
}

/* 材料1個あたりの入手価格：フリマ最安値とトレーダー現金価格（LL・クエスト条件を満たすもの）の安いほう */
function materialCost(it, count){
  let best = null;
  if(!it.types.includes("noFlea") && it.lastLowPrice > 0 && (it.minLevelForFlea || 0) <= S.playerLevel){
    // 2個以上は最安の出品だけでは揃わないので、最安値と24時間平均の中間で見積もる
    const unit = count >= 2 && it.avg24hPrice > it.lastLowPrice ? Math.round((it.lastLowPrice + it.avg24hPrice) / 2) : it.lastLowPrice;
    best = {unit, src: "flea", offers: it.lastOfferCount || 0};
  }
  const tb = cheapestTraderBuy(it);
  if(tb && (!best || tb.priceRUB < best.unit)) best = {unit: tb.priceRUB, src: "trader", name: tb.vendor.name, limit: tb.vendor.buyLimit || 0};
  if(!best) return null;
  let hard = null;
  if(best.src === "flea" && best.offers < count + 2) hard = {k: "matFewOffers", o: best.offers};
  if(best.src === "trader" && best.limit && best.limit < count) hard = {k: "matLimit", o: best.limit};
  return {...best, hard};
}
function rowsB2F(){
  const out = [];
  for(const b of DATA.barters || []){
    const it = b.reward;
    if(!fleaUsable(it)) continue;
    if((b.ll || 1) > (S.ll[b.trader.normalizedName] || 4)) continue;
    if(S.hideTaskLocked && b.task) continue;
    let cost = 0, ok = true; const mats = [];
    for(const r of b.reqs){
      const m = materialCost(r.it, r.count);
      if(!m){ ok = false; break; }
      cost += m.unit * r.count;
      mats.push({it: r.it, count: r.count, ...m});
    }
    if(!ok) continue;
    const unitCost = cost / b.rewardCount;
    const sellPrice = it.lastLowPrice - 1;
    const fee = fleaFee(it.basePrice, sellPrice, DATA.flea);
    const profit = sellPrice - fee - unitCost;
    if(profit < S.minProfit || (it.lastOfferCount || 0) < S.minOffers) continue;
    out.push({key: b.id, it, buy: unitCost, buyFrom: b.trader.name, ll: b.ll, limit: b.limit ? b.limit * b.rewardCount : 0, capBy: "limit", task: b.task,
              sellPrice, fee, profit, line: breakEvenPrice(it.basePrice, unitCost + S.minProfit, DATA.flea), dir: "min",
              mats, matHard: mats.some(m => m.hard)});
  }
  return out;
}

/* ================= レイドで持ち帰る価値（1マスあたり） =================
   スタッシュに入れて売ったときの手取りを、そのアイテムが占めるマス数で割る。
   ・トレーダー … その場で確実に売れる額。手数料なし、FIRも不要
   ・フリマ　　 … 最安値で出したときの手取り（手数料を引いたあと）
   銃はフリマ価格が組み立て済みと混ざっているので、トレーダー側だけで見る。
   弾薬は1マスにまとまるぶん、1マスあたりの価値が上がる。 */
/* ===== 持ち帰りティア表の分類 =====
   品物は、下の LOOT_GROUPS のどれか1つに必ず入る（上から順に見て、最初に当てはまった分類）。
   画面の「分類」のチェックは、この分類だけで出し入れする（1つの品が2つの分類に入ることはない）。
   武器パーツ・銃・防具・ヘルメット・ヘッドセット・マスク・帽子などの小物・ポスター・その他は、品数が多すぎて一覧にならないので常に出さない（LOOT_DROP）。
   それでも分類は必要（例えばマスクを「その他」や「バーター品」に紛れ込ませないため）。
   段位の境目は、表示している分類の品から決める */
const nameOf = it => ((it.name && it.name.en) || "") + " " + ((it.name && it.name.ja) || "");
const hasT = (it, ...tys) => tys.some(ty => it.types.includes(ty));
/* 名前で見分けるとき、売り物の種類が付いた品（バーター品・医療品・食料・鍵）は巻き込まない */
const notGoods = it => !hasT(it, "barter", "meds", "provisions", "keys");
const LOOT_GROUPS = [
  {k: "ammoBox",  test: it => hasT(it, "ammoBox")},
  {k: "gun",      test: it => isGun(it) || !!it.melee},                                   // 拾うのが相当難しい
  {k: "keys",     test: it => hasT(it, "keys", "container")},                             // 落ちていても当てにできない
  /* ヘルメット本体と、そのオプションパーツ（フェイスシールド・マンディブルなど）。種類が無くても性能の種別で見る。防弾プレートは防具 */
  {k: "helmet",   test: it => hasT(it, "helmet") || it.pt === "ItemPropertiesHelmet" || (it.pt === "ItemPropertiesArmorAttachment" && !hasT(it, "armorPlate"))},
  /* 防具・リグは耐久で値段が当てにならない。バッグは自分で背負うもの。種類が付いていない防具（Ops-Core SOTR など）はカテゴリか名前で */
  {k: "armor",    test: it => hasT(it, "armor", "armorPlate", "rig", "backpack")
                    || !!(it.cats && it.cats.some(c => /^(armored-equipment|armor|body-armor|armor-vests|chest-rig|tactical-rigs)$/.test(c)))
                    || (notGoods(it) && /\bSOTR\b|respirator|レスピレーター/i.test(nameOf(it)))},
  /* ヘッドセット：イヤープラグ型（ProFlex など）は種類が違って返ることがあるので名前でも */
  {k: "headset",  test: it => hasT(it, "headphones") || (notGoods(it) && /headset|earplug|proflex|ヘッドセット|イヤープラグ|イヤーマフ/i.test(nameOf(it)))},
  {k: "face",     test: it => isFaceCover(it)},
  /* 帽子・メガネ・ひげなどの身に着ける小物 */
  {k: "wear",     test: it => hasT(it, "glasses", "wearable")
                    || !!(it.cats && it.cats.some(c => /headwear|eyewear|vis-?observ|cosmetic/.test(c)))
                    || (notGoods(it) && (/\b(sunglasses|glasses|goggles|cap|hat|beanie|beret|bandana|beard|mustache|moustache)\b/i.test((it.name && it.name.en) || "")
                        || /サングラス|メガネ|眼鏡|ゴーグル|キャップ|帽子|ニット帽|ベレー|バンダナ|ひげ|ヒゲ|髭/.test((it.name && it.name.ja) || "")))},
  {k: "mods",     test: it => hasT(it, "mods", "suppressor", "pistolGrip")},               // 銃から外す手間の割に安い
  {k: "poster",   test: it => hasT(it, "poster")},
  {k: "grenade",  test: it => hasT(it, "grenade")},
  {k: "meds",     test: it => hasT(it, "meds", "injectors")},
  {k: "provisions", test: it => hasT(it, "provisions")},
  {k: "barter",   test: it => hasT(it, "barter")},
  {k: "other",    test: () => true}
];
/* 画面に並べる分類（この順）と、常に出さない分類 */
const LOOT_GROUP_VIEW = ["barter", "meds", "provisions", "ammoBox", "grenade", "keys"];
const LOOT_DROP = ["mods", "gun", "armor", "helmet", "headset", "face", "wear", "poster", "other"];
function lootGroup(it){ return LOOT_GROUPS.find(g => g.test(it)).k; }
/* マスク・バラクラバなどの顔まわり。種類の名前がAPIに無いので、カテゴリか名前で見分ける */
function isFaceCover(it){
  if(it.cats && it.cats.some(c => /face-?cover|facecover|face cover/.test(c))) return true;          // APIがカテゴリを返す場合はこちら
  const n = nameOf(it);
  return notGoods(it) && /balaclava|バラクラバ|mask|マスク|メンポ|shemagh|シュマグ|scarf|スカーフ|neck gaiter|ネックゲーター/i.test(n) && !/filter|フィルター/i.test(n);
}
let LOOT_RARE = [];   // 出品数が少なくて外した品（画面に件数と名前を出す）
/* 分類やチェックに関係なく、常に出さないもの */
function lootExcluded(it, g){
  const n = nameOf(it);
  /* 分類に関係なく、常に出さないもの */
  if(hasT(it, "preset")) return true;                                // 銃そのものと二重に並ぶだけ
  if(hasT(it, "ammo") && !hasT(it, "ammoBox")) return true;          // 弾をばら売りすることはない（弾薬箱は残す）
  if(/armband|アームバンド|腕章/i.test(n)) return true;
  if(/EFT: ?ARENA|^ARENA |アリーナ/i.test(n)) return true;            // アリーナの品は本編のレイドに落ちていない
  if(/dog ?tag|ドッグタグ/i.test(n)) return true;
  if(/unknown-item/.test(it.iconLink || "")) return true;            // 画像が無い品（ゲームに入ったばかりで情報がそろっていない）
  if(LOOT_DROP.includes(g)) return true;
  return false;
}
/* 入手の難しさ：ドロップ率はAPIに無いので、フリマの出品数で代用する（min 件未満なら外す）。
   フリマに出せない品は出品数が0なので、条件が1件以上なら外れる（0にすると出る）。弾薬箱は箱のままの出品が少ないので、中の弾の出品数で見る */
function lootRare(it, byId, min){
  if(!(min > 0)) return false;
  if(hasT(it, "noFlea")) return true;                                // フリマに出せない品は、出品数0と同じ
  const inner = it.contains && it.contains[0] && byId.get(it.contains[0].id);
  return Math.max(it.lastOfferCount || 0, inner ? inner.lastOfferCount || 0 : 0) < min;
}
/* 品物を n 個まとめて売ったときの手取り（トレーダー・フリマのそれぞれ） */
function sellValue(it, n){
  const sell = bestTraderSell(it);
  const tTotal = sell ? sell.priceRUB * n : 0;
  const fleaOk = !isGun(it) && !it.types.includes("noFlea") && it.lastLowPrice > 0
              && (it.minLevelForFlea || 0) <= S.playerLevel;
  let fTotal = 0, fFee = 0;
  if(fleaOk){
    const price = it.lastLowPrice * n;
    fFee = fleaFee(it.basePrice * n, price, DATA.flea);
    fTotal = Math.max(0, price - fFee);
  }
  return {sellTo: sell ? sell.vendor.name : null, tTotal, fTotal, fFee, fleaOk};
}
function rowsLoot(){
  const all = [];
  LOOT_RARE = [];
  const byId = new Map(DATA.items.map(x => [x.id, x]));
  for(const it of DATA.items){
    const group = lootGroup(it);
    if(lootExcluded(it, group)) continue;
    const slots = Math.max(1, (it.width || 1) * (it.height || 1));
    const stack = it.stack || 1;
    let v = sellValue(it, stack), contents = null;
    /* 弾薬箱：箱のままの値段は安い。開けて中の弾を売った額のほうが高ければ、そちらで見る */
    const c = it.contains && it.contains[0] && byId.get(it.contains[0].id);
    if(c){
      const cv = sellValue(c, it.contains[0].count);
      if(Math.max(cv.tTotal, cv.fTotal) > Math.max(v.tTotal, v.fTotal)){ v = cv; contents = {it: c, count: it.contains[0].count}; }
    }
    const best = Math.max(v.tTotal, v.fTotal);
    if(best <= 0) continue;
    all.push({it, group, slots, stack, contents, sellTo: v.sellTo,
              tTotal: v.tTotal, tPer: v.tTotal / slots, fTotal: v.fTotal, fFee: v.fFee, fPer: v.fTotal / slots,
              fleaOk: v.fleaOk, gun: isGun(it), perSlot: best / slots});
  }
  /* 段位の境目は、既定の分類・既定の出品数の条件の品から決める。
     分類のチェックや出品数を変えても境目は動かない（同じ品の段位が絞り込みで変わらないように） */
  LOOT_CUT = tierCuts(all.filter(r => !DEFAULTS.lootOff.includes(r.group) && !lootRare(r.it, byId, DEFAULTS.lootMinOffers)));
  for(const r of all) r.tier = tierOf(r.perSlot, LOOT_CUT);
  /* 表示するもの：チェックの入った分類で、出品数の条件を満たす品 */
  const off = S.lootOff || [];
  const shown = all.filter(r => {
    if(off.includes(r.group)) return false;
    if(lootRare(r.it, byId, S.lootMinOffers)){ LOOT_RARE.push(r.it); return false; }
    return true;
  });

  const q = (document.getElementById("lootSearch").value || "").trim().toLowerCase();
  const cutEl = document.getElementById("lootCut");
  if(cutEl){
    cutEl.textContent = S.lootMinOffers > 0 ? (LOOT_RARE.length ? t("lootCutN", {n: LOOT_RARE.length}) : t("lootCutNone")) : "";
    cutEl.title = LOOT_RARE.slice(0, 60).map(it => nm(it.name) + "（" + (it.lastOfferCount || 0) + "）").join("\n");
  }
  return shown.filter(r =>
    (!q || (nm(r.it.name) + " " + nm(r.it.shortName) + " " + r.it.name.en).toLowerCase().includes(q)));
}
/* 段位の境目。上から何%かで切る。パッチで相場が動いても、そのときの上位が S になる */
const TIER_P = [["S", .02], ["A", .08], ["B", .20], ["C", .45]];
let LOOT_CUT = null;
function tierCuts(rows){
  const vals = rows.map(r => r.perSlot).filter(v => v > 0).sort((a, b) => b - a);
  const cut = {};
  for(const [k, p] of TIER_P) cut[k] = vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * p))] : 0;
  return cut;
}
const tierOf = (v, c) => !c ? "D" : v >= c.S ? "S" : v >= c.A ? "A" : v >= c.B ? "B" : v >= c.C ? "C" : "D";

/* 7日間の推移から「安定して利益が出るか」を採点 */
function analyzeHistory(row, hist, mode){
  const tsOf = p => isNaN(+p.timestamp) ? Date.parse(p.timestamp) : +p.timestamp;
  // 履歴は全期間ぶん持っているので、ここで選んだ日数だけ切り出す（取り直しは不要）
  const cutoff = Date.now() - S.days * 864e5;
  const pts = (hist || []).filter(p => p.priceMin > 0).map(p => ({...p, t: tsOf(p)}))
                          .filter(p => p.t >= cutoff).sort((a,b) => a.t - b.t);
  if(pts.length < 5){ row.a = {n: pts.length}; return; }
  const gains = pts.map(p => mode === "f2t"
    ? row.sellPrice - p.priceMin
    : (p.priceMin - 1) - fleaFee(row.it.basePrice, p.priceMin - 1, DATA.flea) - row.buy);
  const ok = gains.filter(g => g >= S.minProfit);
  const offers = pts.map(p => p.offerCount || 0).sort((a,b) => a - b);
  const prices = pts.map(p => p.priceMin);
  const mean = prices.reduce((a,b) => a + b, 0) / prices.length;
  const sd = Math.sqrt(prices.reduce((a,b) => a + (b - mean) ** 2, 0) / prices.length);
  const rate = ok.length / pts.length;
  const avgGain = ok.length ? ok.reduce((a,b) => a + b, 0) / ok.length : 0;
  row.a = { n: pts.length, rate, avgGain, expected: rate * avgGain, medOffers: offers[Math.floor(offers.length / 2)],
            cv: mean ? sd / mean : 0, prices, times: pts.map(p => p.t) };
  row.a.liq = liquidity(row.it, pts, mean, row.a.cv);
}

/* 1日あたりの傾き（最小二乗法） */
function slopePerDay(xs, ys){
  const n = xs.length, mx = xs.reduce((a,b) => a + b, 0) / n, my = ys.reduce((a,b) => a + b, 0) / n;
  let num = 0, den = 0;
  for(let i = 0; i < n; i++){ num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  return den ? (num / den) * 864e5 : 0;
}
/* 売れやすさ：出来高データが無いため、価格・出品数の動きと需要の有無から推定する。
   理由は言語を切り替えても表示できるよう、コードと数値で持つ */
function liquidity(it, pts, meanPrice, cv){
  const xs = pts.map(p => p.t);
  const offers = pts.map(p => p.offerCount || 0);
  const meanOff = offers.reduce((a,b) => a + b, 0) / offers.length;
  const priceTrend = meanPrice ? slopePerDay(xs, pts.map(p => p.priceMin)) / meanPrice * 100 : 0;   // %/日
  const offerTrend = meanOff ? slopePerDay(xs, offers) / meanOff * 100 : 0;                         // %/日
  const spreads = pts.filter(p => p.price > 0).map(p => (p.price - p.priceMin) / p.price).sort((a,b) => a - b);
  const spread = spreads.length ? spreads[Math.floor(spreads.length / 2)] : null;
  const d = it.demand;
  const kinds = d ? DEMAND_KEYS.filter(k => d[k] > 0) : [];

  // 各要素の加点・減点（pt）を理由と一緒に持ち、画面で内訳を確認できるようにする
  let score = 50; const why = [];
  const add = (pt, w) => { pt = Math.round(pt); score += pt; why.push({...w, pt}); };
  if(priceTrend <= -3) add(-Math.min(25, -priceTrend * 3), {k: "priceDown", v: priceTrend.toFixed(1)});
  else if(priceTrend >= 2) add(5, {k: "priceUp"});
  if(offerTrend >= 5) add(-Math.min(20, offerTrend * 1.5), {k: "offersUp", v: offerTrend.toFixed(0)});
  else if(offerTrend <= -3 && priceTrend > -3) add(10, {k: "offersDown"});
  // 平均価格は割高な出品に引っ張られやすいため、差が小さいときの加点だけに使う
  if(spread != null && spread < 0.05) add(10, {k: "spreadSmall"});
  if(cv > 0.3) add(-10, {k: "volatile"});
  const medOff = [...offers].sort((a,b) => a - b)[Math.floor(offers.length / 2)];
  if(medOff < 3) add(-15, {k: "thin"});
  else if(medOff < 5) add(-5, {k: "fewish"});
  if(kinds.length) add(Math.min(15, kinds.length * 5), {k: "demand", kinds});
  // 影響の大きい理由から表示
  why.sort((a,b) => Math.abs(b.pt) - Math.abs(a.pt));
  score = Math.max(0, Math.min(100, Math.round(score)));
  return {score, level: score >= 65 ? "high" : score >= 40 ? "mid" : "low", why, priceTrend, offerTrend};
}
const whyText = w => w.k === "demand"
  ? t("why.demand", {list: w.kinds.map(k => t("demand")[k]).join(t("demandSep"))})
  : t("why." + w.k, {v: w.v});

function spark(r){
  if(!r.a || !r.a.prices) return r.a ? `<span class="note">${t("tooFew")}</span>` : "";
  const W = 150, H = 34, ps = r.a.prices, ts = r.a.times;
  // 手数料が重すぎて境目が出せない品もあるので、そのときは線と帯を描かない
  const hasLine = isFinite(r.line);
  const lo = Math.min(...ps, hasLine ? r.line : Infinity), hi = Math.max(...ps, hasLine ? r.line : -Infinity), span = (hi - lo) || 1;
  const t0 = ts[0], t1 = ts[ts.length - 1] || t0 + 1;
  const x = v => ((v - t0) / ((t1 - t0) || 1)) * (W - 2) + 1, y = v => H - 2 - ((v - lo) / span) * (H - 4);
  const d = ps.map((p,i) => (i ? "L" : "M") + x(ts[i]).toFixed(1) + " " + y(p).toFixed(1)).join(" ");
  if(!hasLine) return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("sparkLabel", {d: S.days, line: ""}))}">
    <path d="${d}" fill="none" stroke="var(--text)" stroke-width="1.3"/></svg>`;
  const lyN = Math.max(0, Math.min(H, y(r.line)));
  const ly = lyN.toFixed(1);
  // 線より「利益の出ない側」を薄く塗る。線がこの帯に入っている時間が長いほど、出しても損になる
  const band = r.dir === "max"
    ? `<rect x="0" y="0" width="${W}" height="${ly}" fill="var(--loss)" opacity=".16"/>`
    : `<rect x="0" y="${ly}" width="${W}" height="${(H - lyN).toFixed(1)}" fill="var(--loss)" opacity=".16"/>`;
  const label = t("sparkLabel", {d: S.days, line: t(TAB === "f2t" ? "lineF2T" : "lineT2F")});
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${band}<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--tan)" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="var(--text)" stroke-width="1.3"/></svg>`;
}

/* 取ったデータを画面に流す（保存データでも、その場で取ったものでも同じ） */
function applyData(d, statusKey){
  DATA = d;
  HIST_CACHE.clear(); ROWS = []; setProgress(null);
  setStatus(statusKey, {modeKey: S.mode, count: DATA.items.length, at: DATA.at});
  document.getElementById("analyzeBtn").disabled = false;
  buildLootGroups();
  recompute();
  if(TAB !== "loot" && PAGE !== "watch") analyzeTop();
}
/* その場で tarkov.dev から取る */
async function loadLive(){
  setStatus("loading");
  try{
    const d = await loadAll(step => { $status.textContent = t("loading") + " " + step; });
    applyData({...d, at: new Date()}, "loaded");
  }catch(err){
    setStatus("loadFail", {msg: err.message}); console.error(err);
  }

/* 開いたとき・モードを変えたとき：サーバーの保存データがあれば、すぐそれを出す。無ければその場で取る */
let LOADING = false;
async function loadInitial(){
  LOADING = true; setStatus("loading");
  try{
    const snap = await loadSnapshot(S.mode);
    if(snap) applyData(snap, "loadedSnap");
    else await loadLive();
  }finally{
    LOADING = false;
    nextCheck = DATA ? DATA.at.getTime() + FRESH_MS : Date.now() + RETRY_MS;
  }
}

/* 開いたままでも、新しい保存データが出たら差し替える。
   保存は GitHub Actions が1時間おき（毎時23分ごろ）に行うので、手元のデータが1時間ほど古くなってから確かめる。
   まだ新しいものが無ければ15分おきに確かめ直す。画面を見ていないあいだは何もしない */
const FRESH_MS = 62 * 60 * 1000, RETRY_MS = 15 * 60 * 1000;
let nextCheck = Infinity;
async function refreshIfStale(){
  if(document.hidden || LOADING || Date.now() < nextCheck) return;
  if(!DATA) return loadInitial();                       // 取れなかったときは、ここで取り直す
  const mode = S.mode, cur = DATA;
  nextCheck = Date.now() + RETRY_MS;
  const snap = await loadSnapshot(mode);
  if(!snap || DATA !== cur || S.mode !== mode || snap.at <= cur.at) return;
  applyData(snap, "loadedSnap");
  nextCheck = snap.at.getTime() + FRESH_MS;
}
setInterval(refreshIfStale, 60 * 1000);
document.addEventListener("visibilitychange", refreshIfStale);

/* 上位N件の7日間推移を取得して分析（価格取得後・タブ切り替え後にも自動で実行） */
let analyzing = false, rerun = false;
async function analyzeTop(){
  if(!DATA) return;
  if(analyzing){ rerun = true; return; }
  analyzing = true;
  const btn = document.getElementById("analyzeBtn"); btn.disabled = true;
  const n = +document.getElementById("topN").value;
  const tab = TAB;
  if(TAB === "loot"){ analyzing = false; btn.disabled = false; return; }
  const targets = [...ROWS].sort((a,b) => b.profit - a.profit).slice(0, n);
  const need = [...new Map(targets.filter(r => !HIST_CACHE.has(r.it.id)).map(r => [r.it.id, r])).values()];
  try{
    setProgress("autoAnalyzing", {n: targets.length});
    let done = 0;
    for(let i = 0; i < need.length; i += 6){
      const chunk = need.slice(i, i + 6);
      await Promise.all(chunk.map(async r => {
        const all = await getJson("prices/" + r.it.id, "prices").catch(() => []);
        HIST_CACHE.set(r.it.id, all || []);          // 全期間ぶん持つ。日数の切り替えで取り直さずに済む
        setProgress("histProgress", {i: ++done, n: need.length});
      }));
    }
    if(tab === TAB){
      for(const r of ROWS){ const h = HIST_CACHE.get(r.it.id); if(h){ r.hist = h; analyzeHistory(r, h, TAB); } }
      SORT = {key: "expected", dir: -1};
      setProgress("histDone", {n: targets.length});
      render();
    }
  }catch(err){
    setProgress("histFail", {msg: err.message});
  }finally{
    btn.disabled = false; analyzing = false;
    if(rerun){ rerun = false; analyzeTop(); }
  }

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

const mt = (k, v) => String((MK_I18N[S.lang] || MK_I18N.ja)[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v && v[x] != null ? v[x] : "");
const MK_PAGE = PAGE === "watch";
const $mk = document.getElementById("marketPanel");
const MK_HIST = new Map();                 // id → {hist, at}（30分は使い回す）
let MK_BUSY = null, MK_OPEN = null, MK_Q = "";
const MK_KINDS = ["barter", "meds", "provisions", "keys", "mods", "ammoBox", "container", "injectors", "grenade"];

/* 候補にしてよい品：フリマで売れる・銃とプリセット以外・出品数と値段の新しさの条件を満たす */
/* 候補の母集団：フリマで売れる・銃とプリセット以外・種類。ここで「各○品」に絞る。
   出品数と値段の更新の条件は、絞ったあと（mkShowOk）に掛ける。先に掛けると、条件を厳しくしたときに
   上位から外れた品のかわりに別の品が候補に入り、かえって一覧が増えることがあるため */
function mkEligible(it){
  if(it.types.includes("noFlea") || it.types.includes("preset") || isGun(it)) return false;
  if(!(it.lastLowPrice > 0) || !(it.avg24hPrice > 0)) return false;
  if(S.mkKind && !it.types.includes(S.mkKind)) return false;
  return true;
}
/* 値段の更新の条件は固定（利用者は選ばない）。データを取った時点で、最安値の読み取りが120分以内の品だけ。
   tarkov.dev の読み取りは品物によって1〜2時間おきで、価格は1時間おきに保存するため、60分では保存した時刻によって候補が0になることがある */
const MK_FRESH_MIN = 120;
/* 表示の条件：出品数・値段の更新。条件を厳しくすると、一覧は必ず減る（増えない） */
function mkShowOk(it){
  if((it.lastOfferCount || 0) < (S.mkMinOffers || 0)) return false;
  if(!isFresh(it.updated || 0, +DATA.at || Date.now(), MK_FRESH_MIN)) return false;
  return true;
}
/* 候補：上の条件（種類・出品数・値段の更新）をすべて満たし、かつ24時間平均か48時間前より「目安」以上外れている品。
   上位何品という切り方はしない（切り方によっては、条件を厳しくすると別の品が繰り上がって一覧が増えるため）。
   そのため、条件を厳しくすれば一覧は必ず減り、「すべて」は個別の種類を必ず含む。
   多すぎるときだけ、外れ具合の大きい順に MK_MAX 品で止める（そのときは画面に出す） */
const MK_MAX = 300;
let MK_CAPPED = {buy: 0, sell: 0};
function mkCandidates(){
  const pool = DATA.items.filter(it => mkEligible(it) && mkShowOk(it));
  const th = (S.mkTh ?? 5) / 100;
  const pick = side => {
    const all = pool.map(it => ({it, sc: candScore(it, side, th)})).filter(c => c.sc != null).sort((a, b) => b.sc - a.sc);
    MK_CAPPED[side] = Math.max(0, all.length - MK_MAX);
    return all.slice(0, MK_MAX).map(c => c.it);
  };
  const buy = pick("buy"), sell = pick("sell");
  const q = MK_Q.trim().toLowerCase();
  const found = q.length >= 2 ? DATA.items.filter(it => !it.types.includes("noFlea") && !it.types.includes("preset") && it.lastLowPrice > 0
      && (nm(it.name) + " " + nm(it.shortName) + " " + (it.name.en || "")).toLowerCase().includes(q)).slice(0, 8) : [];
  return {buy, sell, found};
}
/* 候補のうち、記録をまだ持っていない品だけ取りに行く（6件ずつ） */
async function mkFetch(items){
  const need = [...new Map(items.filter(it => { const c = MK_HIST.get(it.id); return !c || Date.now() - c.at > 30 * 60000; }).map(it => [it.id, it])).values()];
  if(!need.length || MK_BUSY) return;
  MK_BUSY = {i: 0, n: need.length}; paintMarket();
  for(let i = 0; i < need.length; i += 6){
    await Promise.all(need.slice(i, i + 6).map(async it => {
      const hist = await getJson("prices/" + it.id, "prices").catch(() => null);
      MK_HIST.set(it.id, {hist: hist || [], at: Date.now()});
      MK_BUSY.i++;
    }));
    paintMarket();
  }
  MK_BUSY = null;
  paintMarket();
}
function mkView(it){
  const c = MK_HIST.get(it.id); if(!c) return null;
  return marketView(c.hist, {days: S.mkDays || 30, live: {price: it.lastLowPrice, at: it.updated || 0}});
}
const pctTxt = r => (r >= 0 ? "+" : "") + Math.round(r * 100) + "%";
function mkAgo(t){
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 90 ? mt("ago", {n: m}) : mt("agoH", {n: Math.round(m / 60)});
}
const netOf = (it, price) => price - fleaFee(it.basePrice, price, DATA.flea);

/* 買い場の見込み利益（いまの最安値で買って、おすすめ売値で売る） */
function mkProfit(it, v){
  const tr = bestTraderSell(it);
  const p = buyProfit(v.price, v.sellAt, ask => fleaFee(it.basePrice, ask, DATA.flea), tr ? tr.priceRUB : 0);
  p.perSlot = p.profit / Math.max(1, (it.width || 1) * (it.height || 1));
  return p;
}
/* ---- 1行 ---- */
function mkRow(it, v, side, pf){
  const icon = it.iconLink ? `<img src="${esc(it.iconLink)}" alt="" loading="lazy">` : "";
  const tag = v.zone === "buy" ? `<span class="mtag buy">${mt("tagBuy")}</span>` : v.zone === "sell" ? `<span class="mtag sell">${mt("tagSell")}</span>` : "";
  const rec = side === "sell" || (side === "found" && v.zone === "sell")
    ? `<b>${esc(mt("recSell", {p: yen(v.sellAt)}))}</b><div class="note">${esc(mt("recNet", {p: yen(netOf(it, v.sellAt))}))}</div>`
    : `<b>${esc(mt("recBuy", {p: yen(v.buyAt)}))}</b>`;
  const trend = v.trend == null ? "―" : Math.abs(v.trend) < 0.03 ? mt("flat") : mt(v.trend > 0 ? "up" : "down", {p: pctTxt(v.trend)});
  const open = MK_OPEN === it.id;
  return `<tr class="mrow${open ? " open" : ""}" data-id="${esc(it.id)}" tabindex="0">`
    + `<td class="l"><span class="wico">${icon}</span>${esc(nm(it.name))}${copyBtn(nm(it.name))}${tag}${stockTagHtml(it.id)}${side !== "sell" ? stockAddBtn(it.id) : ""}</td>`
    + `<td>${yen(v.price)}<div class="note">${esc(mt("nowSub", {n: CUR_SCANS, ago: mkAgo(v.at)}))}</div>${v.oddLow ? `<div class="note warn">${esc(mt("oddLow", {p: yen(v.oddLow.price)}))}</div>` : ""}</td>`
    + `<td><span class="mrange" title="${esc(yen(v.low) + " 〜 " + yen(v.high))}"><i style="left:${(v.pos * 100).toFixed(1)}%"></i></span><div class="mrangeL"><span>${yen(v.low)}</span><span>${yen(v.high)}</span></div></td>`
    + `<td>${Math.round(v.pos * 100)}%</td>`
    + `<td class="mrec">${rec}</td>`
    + (pf ? `<td class="mprofit"><b>${yen(pf.profit)}</b> <span class="note">(${pctTxt(pf.rate)})</span><div class="note">${esc(mt("profitSub", {via: mt(pf.via === "trader" ? "viaTrader" : "viaFlea"), net: yen(pf.sellNet), slot: yen(pf.perSlot)}))}</div></td>` + `<td>${v.rebounds > 0 ? `<b>${v.rebounds}回</b><div class="note">${esc(mt("reboundSub", {n: S.mkDays || 30}))}</div>` : `<span class="note warn">${esc(mt("reboundNone", {p: yen(v.recentHigh)}))}</span>`}</td>` : "")
    + `<td>${esc(trend)}</td>`
    + `<td>${fmt(it.lastOfferCount || 0)}</td></tr>`
    + (open ? `<tr class="mdetail"><td colspan="${pf ? 9 : 7}">${mkDetail(it, v)}</td></tr>` : "");
}
/* ---- 開いた行：グラフと説明 ---- */
const CH = {w: 720, h: 160, padL: 4, padR: 58, padY: 8};
const MK_CHART = new Map();
function mkDetail(it, v){
  const now = Date.now(), from = now - (S.mkDays || 30) * DAY;
  const pts = v.pts.filter(p => p.t >= from);
  const lines = trendLines(v.pts, from, now, Math.max(HOUR, (now - from) / 240));
  const vals = [...pts.map(p => p.price), ...lines.flatMap(l => [l.short, l.long]).filter(x => x != null), v.buyAt, v.sellAt].sort((a, b) => a - b);
  let lo = quantile(vals, 0.02), hi = quantile(vals, 0.98);
  if(hi - lo < hi * 0.02){ lo *= 0.99; hi *= 1.01; }
  const W = CH.w - CH.padL - CH.padR, Hh = CH.h - CH.padY * 2;
  const x = t => CH.padL + (t - from) / (now - from) * W;
  const y = val => CH.padY + (1 - (Math.min(hi, Math.max(lo, val)) - lo) / (hi - lo)) * Hh;
  const path = key => { let d = "", pen = false; for(const l of lines){ const val = l[key]; if(val == null){ pen = false; continue; } d += (pen ? "L" : "M") + x(l.t).toFixed(1) + " " + y(val).toFixed(1); pen = true; } return d; };
  MK_CHART.set(it.id, {from, to: now, lines, pts});
  const ref = (val, cls, label) => `<line class="${cls}" x1="${CH.padL}" x2="${CH.padL + W}" y1="${y(val).toFixed(1)}" y2="${y(val).toFixed(1)}"/><text x="${CH.padL + W + 4}" y="${(y(val) + 3).toFixed(1)}">${esc(label)}</text>`;
  const svg = `<svg class="wchart" data-id="${esc(it.id)}" viewBox="0 0 ${CH.w} ${CH.h}" width="${CH.w}" height="${CH.h}" role="img" aria-label="${esc(nm(it.name))}">`
    + pts.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="1.8" class="dot"/>`).join("")
    + ref(v.buyAt, "ref-buy", yen(v.buyAt)) + ref(v.sellAt, "ref-sell", yen(v.sellAt))
    + `<path d="${path("long")}" class="ma-long"/><path d="${path("short")}" class="ma-short"/>`
    + `<line class="cross" x1="0" x2="0" y1="0" y2="${CH.h}" visibility="hidden"/></svg>`;
  const legend = `<div class="wleg"><span><i class="ld"></i>${mt("legDot")}</span><span><i class="ls"></i>${mt("legShort")}</span><span><i class="ll"></i>${mt("legLong")}</span><span><i class="lb"></i>${mt("legBuy")}</span><span><i class="lh"></i>${mt("legSell")}</span></div>`;
  const text = mt("detail", {d: S.mkDays || 30, low: yen(v.low), med: yen(v.median), high: yen(v.high), short: yen(v.short), long: yen(v.long)});
  return legend + svg + `<div class="mtext">${esc(text)}</div>`;
}
/* ---- 一覧の節 ---- */
function mkSection(side, items){
  const d = S.mkDays || 30;
  let views = items.map(it => ({it, v: mkView(it)})).filter(x => x.v);
  const few = views.filter(x => x.v.zone === "few").length;
  views = views.filter(x => x.v.zone !== "few");
  let lowN = 0, profitN = 0;
  if(side === "buy"){
    // 底値寄り（位置40%以下）の品のうち、見込み利益が条件に合うものだけ。利益の大きい順
    const low = views.filter(x => x.v.pos <= 0.4);
    lowN = low.length;
    views = low.map(x => ({...x, pf: mkProfit(x.it, x.v)}))
               .filter(x => x.pf.profit >= (S.mkMinProfit || 0) && x.pf.rate * 100 >= (S.mkMinRate || 0));
    profitN = views.length;
    // 底値（おすすめ買値以下）まで下がったあと、おすすめ売値まで一度も戻ったことがない品は外す（戻る見込みが薄い）
    if(S.mkNeedRebound !== false) views = views.filter(x => x.v.rebounds > 0);
    views.sort((a, b) => b.pf.profit - a.pf.profit);
  }
  else if(side === "sell") views = views.filter(x => x.v.pos >= 0.6).sort((a, b) => b.v.pos - a.v.pos);
  const head = `<thead><tr><th class="l">${mt("cName")}</th><th>${mt("cNow")}</th><th>${mt("cRange", {d})}</th><th>${mt("cPos")}</th><th>${mt("cRec")}</th>${side === "buy" ? `<th>${mt("cProfit")}</th><th>${mt("cRebound")}</th>` : ""}<th>${mt("cTrend")}</th><th>${mt("cOffers")}</th></tr></thead>`;
  const title = side === "found" ? mt("searchTitle") : mt(side === "buy" ? "buyTitle" : "sellTitle", {d});
  const body = views.length ? `<table class="mtbl">${head}<tbody>${views.map(x => mkRow(x.it, x.v, side, x.pf)).join("")}</tbody></table>`
    : `<p class="note">${esc(side === "buy" && profitN ? mt("noneRebound", {n: lowN, m: profitN}) : side === "buy" && lowN ? mt("noneProfit", {p: yen(S.mkMinProfit || 0), r: S.mkMinRate || 0, n: lowN}) : mt("none", {n: items.length}))}</p>`;
  return `<section class="msec ${side}"><h2>${esc(title)}</h2>${body}${few ? `<p class="note">${esc(mt("fewAll", {n: few}))}</p>` : ""}${MK_CAPPED[side] ? `<p class="note warn">${esc(mt("capped", {n: MK_MAX, m: MK_CAPPED[side]}))}</p>` : ""}</section>`;
}
/* ---- 操作の帯 ---- */
function mkBar(){
  const sel = (key, opts) => `<select data-mk="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(S[key]) === String(v) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="mbar">`
    + `<label class="note">${mt("days")} ${sel("mkDays", [7, 14, 30].map(n => [n, mt("daysOpt", {n})]))}</label>`
    + `<label class="note" title="${esc(mt("thTip"))}">${mt("th")} ${sel("mkTh", [3, 5, 10, 15].map(n => [n, mt("thOpt", {n})]))}</label>`
    + `<label class="note">${mt("kind")} ${sel("mkKind", [["", mt("kindAll")], ...MK_KINDS.map(k => [k, t("kinds")[k] || k])])}</label>`
    + `<label class="note">${mt("minOffers")} <input type="number" data-mk="mkMinOffers" min="0" max="999" value="${S.mkMinOffers}">${mt("minOffers2")}</label>`
    + `<label class="note">${mt("minProfit")}<input type="number" data-mk="mkMinProfit" min="0" step="1000" value="${S.mkMinProfit}" style="width:6.5em">${mt("minProfit2")}<input type="number" data-mk="mkMinRate" min="0" max="500" value="${S.mkMinRate}">${mt("minRate2")}</label>`
    + `<label class="note"><input type="checkbox" data-mk="mkNeedRebound" ${S.mkNeedRebound !== false ? "checked" : ""}>${mt("needRebound")}</label>`
    + `<input type="search" data-mk="q" placeholder="${esc(mt("search"))}" value="${esc(MK_Q)}" size="22">`
    + `<span class="note">${MK_BUSY ? esc(mt("loading", MK_BUSY)) : ""}</span></div>`;
}
function paintMarket(){
  if(!$mk || !MK_PAGE) return;
  $mk.hidden = false;
  if(!DATA){ $mk.innerHTML = mkBar() + `<p class="note">${esc(mt("needData"))}</p>`; return; }
  const c = mkCandidates();
  const focusQ = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.mk === "q";
  $mk.innerHTML = mkBar()
    + stockSection()
    + (c.found.length ? mkSection("found", c.found) : "")
    + mkSection("buy", c.buy) + mkSection("sell", c.sell)
;
  if(focusQ){ const q = $mk.querySelector('[data-mk="q"]'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  mkFetch([...stockItems(), ...c.found, ...c.buy, ...c.sell]);
}

/* ---- 操作 ---- */
if($mk){
  $mk.addEventListener("change", e => {
    if(onStockChange(e)) return;                                                       // 在庫の数量・買値の書き換え
    const el = e.target, k = el.dataset.mk; if(!k || k === "q") return;
    S[k] = k === "mkKind" ? el.value : el.type === "checkbox" ? el.checked : Math.max(0, +el.value || 0);
    saveSettings(); MK_OPEN = null; paintMarket();
  });
  $mk.addEventListener("input", e => { if(e.target.dataset.mk === "q"){ MK_Q = e.target.value; paintMarket(); } });
  const toggle = row => { MK_OPEN = MK_OPEN === row.dataset.id ? null : row.dataset.id; paintMarket(); };
  $mk.addEventListener("click", e => {
    const b = e.target.closest("button[data-copy]"); if(b){ onCopyClick(b); return; }   // 名前のコピー（行は開かない）
    try{ if(onStockClick(e)) return; }                                                 // 在庫の操作（stock-ui.js）
    catch(err){ console.error(err); alert("在庫の操作でエラーが起きました：" + err.message); return; }
    if(e.target.closest("tr.mform, tr.sedit")) return;
    const row = e.target.closest("tr.mrow"); if(row) toggle(row);
  });
  $mk.addEventListener("keydown", e => { if(e.target.closest("button")) return; const row = e.target.closest("tr.mrow"); if(row && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggle(row); } });
  /* グラフにカーソルを乗せると、その時点の値（縦線つき） */
  $mk.addEventListener("mousemove", e => {
    const svg = e.target.closest("svg.wchart"), tip = document.getElementById("tip");
    $mk.querySelectorAll("svg.wchart .cross").forEach(c => { if(!svg || !svg.contains(c)) c.setAttribute("visibility", "hidden"); });
    if(!svg){ if(tip.dataset.from === "chart"){ tip.hidden = true; delete tip.dataset.from; } return; }
    const c = MK_CHART.get(svg.dataset.id); if(!c || !c.lines.length) return;
    const r = svg.getBoundingClientRect(), sx = r.width / CH.w;
    const fx = Math.min(1, Math.max(0, ((e.clientX - r.left) / sx - CH.padL) / (CH.w - CH.padL - CH.padR)));
    const tt = c.from + fx * (c.to - c.from);
    const l = c.lines.reduce((a, b) => Math.abs(b.t - tt) < Math.abs(a.t - tt) ? b : a);
    const p = c.pts.length ? c.pts.reduce((a, b) => Math.abs(b.t - tt) < Math.abs(a.t - tt) ? b : a) : null;
    const cross = svg.querySelector(".cross"), cx = CH.padL + fx * (CH.w - CH.padL - CH.padR);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    const date = new Date(l.t).toLocaleString(locale(), {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"});
    tip.textContent = mt("chartTip", {date, price: p ? yen(p.price) : "―", short: yen(l.short), long: yen(l.long)});
    tip.hidden = false; tip.dataset.from = "chart";
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 6) + "px"; tip.style.top = (e.clientY + 18) + "px";
  });
  $mk.addEventListener("mouseleave", () => { const tip = document.getElementById("tip"); if(tip.dataset.from === "chart"){ tip.hidden = true; delete tip.dataset.from; } });
}

/* ================= 売り時・買い時：在庫（仕込んだ品） =================
   買い場の品に「仕込んだ」を押す → 数量と1個あたりの買値を入れて記録する（このブラウザに保存）
   在庫の欄で、いまの相場・おすすめ売値・いま売ったときの損益を見せ、売り場になった品を「売り時」として上に出す
   売ったら「売った」で記録から外す。判定は market.js の stockState、相場の見方は売り時・買い時と同じ（marketView） */

const ST_I18N = {
  ja: {
    title: "在庫（仕込んだ品）", sellN: "売り時 {n}品",
    empty: "まだありません。買い場の品の「仕込んだ」を押すと、ここに記録されます。",
    cName: "品物", cQty: "数量", cCost: "買値／個", cNow: "いまの相場", cTarget: "おすすめ売値", cPL: "いま売ると", cState: "状態",
    plSub: "1個 {each}（手取り {net}）", targetSub: "手取り {net}・合計 {total}",
    sell: "売り時", high: "高値付近（売ると赤字）", plus: "売れば利益（まだ上がる余地）", hold: "待ち", few: "記録が少ない", wait: "確認中",
    sold: "売った", soldAsk: "{name} を在庫から外しますか？",
    add: "仕込んだ", addTitle: "{name} を在庫に記録", qty: "数量", cost: "1個あたりの買値", save: "記録する", cancel: "やめる",
    held: "在庫 {n}", otherMode: "ほかのモードの在庫 {n}品（モードを切り替えると表示）",
    total: "在庫の合計：買値 {cost}・いま売ると {now}（{pl}）",
  },
  en: {
    title: "Stock (items you bought)", sellN: "{n} to sell",
    empty: "Nothing yet. Press \"Bought\" on a buy-zone item to record it here.",
    cName: "Item", cQty: "Qty", cCost: "Cost / unit", cNow: "Market now", cTarget: "Suggested sell", cPL: "If sold now", cState: "Status",
    plSub: "{each} each (take-home {net})", targetSub: "take-home {net}, total {total}",
    sell: "Sell", high: "Near the high (would be a loss)", plus: "In profit (may rise further)", hold: "Hold", few: "Not enough data", wait: "Checking",
    sold: "Sold", soldAsk: "Remove {name} from stock?",
    add: "Bought", addTitle: "Record {name} as stock", qty: "Qty", cost: "Cost per unit", save: "Save", cancel: "Cancel",
    held: "stock {n}", otherMode: "{n} items in other modes (switch mode to see them)",
    total: "Stock total: cost {cost}, if sold now {now} ({pl})",
  },
};
const stt = (k, v) => String((ST_I18N[S.lang] || ST_I18N.ja)[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v && v[x] != null ? v[x] : "");

/* ---- 記録（設定と一緒にブラウザへ保存。モードごと） ---- */
const stockAll = () => Array.isArray(S.mkStock) ? S.mkStock : [];
const stockList = () => stockAll().filter(s => (s.mode || "regular") === S.mode);
const stockOf = id => stockList().filter(s => s.id === id);
function stockItems(){ return DATA ? stockList().map(s => DATA.items.find(it => it.id === s.id)).filter(Boolean) : []; }
function stockSave(list){ S.mkStock = list; saveSettings(); }
function stockAdd(id, qty, cost){ stockSave([...stockAll(), {id, qty, cost, at: Date.now(), mode: S.mode}]); }

/* ---- 買い場の行に付ける部品 ---- */
function stockTagHtml(id){
  const n = stockOf(id).reduce((a, s) => a + s.qty, 0);
  return n ? `<span class="mtag held">${esc(stt("held", {n: fmt(n)}))}</span>` : "";
}
function stockAddBtn(id){ return `<button type="button" class="sadd" data-stock-add="${esc(id)}">${esc(stt("add"))}</button>`; }
/* 「仕込んだ」の入力欄：一覧の外（画面の上に浮かぶ小窓）に出す。
   一覧は価格記録を取るたびに描き直されるので、その中に置くと入力中に消えたり、開いたのに見えなかったりするため */
function stockDialog(it, v){
  let dlg = document.getElementById("stockDlg");
  if(!dlg){
    dlg = document.createElement("div"); dlg.id = "stockDlg"; dlg.setAttribute("role", "dialog");
    document.body.appendChild(dlg);
    dlg.addEventListener("click", e => {
      if(e.target.closest("[data-stock-cancel]")){ dlg.hidden = true; return; }
      const save = e.target.closest("[data-stock-save]"); if(!save) return;
      const qty = Math.max(1, Math.round(+dlg.querySelector('[data-sf="qty"]').value || 1));
      const cost = Math.max(1, Math.round(+dlg.querySelector('[data-sf="cost"]').value || 1));
      stockAdd(save.dataset.stockSave, qty, cost); dlg.hidden = true; paintMarket();
    });
    dlg.addEventListener("keydown", e => {
      if(e.key === "Escape") dlg.hidden = true;
      if(e.key === "Enter"){ const b = dlg.querySelector("[data-stock-save]"); if(b) b.click(); }
    });
  }
  dlg.innerHTML = `<div class="sform"><b>${esc(stt("addTitle", {name: nm(it.name)}))}</b>`
    + `<label class="note">${stt("qty")} <input type="number" data-sf="qty" min="1" value="1" style="width:5em"></label>`
    + `<label class="note">${stt("cost")} <input type="number" data-sf="cost" min="1" value="${Math.round(v ? v.price : it.lastLowPrice || 0)}" style="width:8em"></label>`
    + `<button type="button" class="primary" data-stock-save="${esc(it.id)}">${stt("save")}</button>`
    + `<button type="button" data-stock-cancel>${stt("cancel")}</button></div>`;
  dlg.hidden = false;
  const q = dlg.querySelector('[data-sf="qty"]'); q.focus(); q.select();
}

/* ---- 在庫の欄 ---- */
function stockSection(){
  const list = stockList(), others = stockAll().length - list.length;
  const head = `<h2>${esc(stt("title"))}</h2>`;
  if(!list.length) return `<section class="msec stock">${head}<p class="note">${esc(stt("empty"))}</p>${others ? `<p class="note">${esc(stt("otherMode", {n: others}))}</p>` : ""}</section>`;
  const sgnYen = n => (n >= 0 ? "+" : "-") + yen(Math.abs(n));
  let costSum = 0, nowSum = 0;
  const rows = list.map((s, i) => {
    const idx = stockAll().indexOf(s);
    const it = DATA.items.find(x => x.id === s.id);
    const v = it ? mkView(it) : null;
    const netNow = v && v.zone !== "few" ? netOf(it, v.price) : null;
    const state = !it ? "few" : !v ? "wait" : stockState(v, s.cost, netNow);
    costSum += s.cost * s.qty; if(netNow != null) nowSum += netNow * s.qty;
    return {s, idx, it, v, netNow, state};
  }).sort((a, b) => (a.state === "sell" ? 0 : 1) - (b.state === "sell" ? 0 : 1));
  const sellN = rows.filter(r => r.state === "sell").length;
  const body = rows.map(({s, idx, it, v, netNow, state}) => {
    const name = it ? nm(it.name) : s.id;
    const icon = it && it.iconLink ? `<img src="${esc(it.iconLink)}" alt="" loading="lazy">` : "";
    const ok = v && v.zone !== "few";
    const pl = ok ? (netNow - s.cost) * s.qty : null;
    const tag = ok && v.zone === "buy" ? `<span class="mtag buy">${mt("tagBuy")}</span>` : ok && v.zone === "sell" ? `<span class="mtag sell">${mt("tagSell")}</span>` : "";
    return `<tr class="srow s-${state}" data-id="${esc(s.id)}">`
      + `<td class="l"><span class="wico">${icon}</span>${esc(name)}${copyBtn(name)}${tag}</td>`
      + `<td><input type="number" data-stock-qty="${idx}" min="1" value="${s.qty}" style="width:4.5em"></td>`
      + `<td><input type="number" data-stock-cost="${idx}" min="1" value="${s.cost}" style="width:7em"></td>`
      + `<td>${ok ? yen(v.price) + `<div class="note">${Math.round(v.pos * 100)}%・${esc(mkAgo(v.at))}</div>` : "―"}</td>`
      + `<td>${ok ? yen(v.sellAt) + `<div class="note">${esc(stt("targetSub", {net: yen(netOf(it, v.sellAt)), total: yen(netOf(it, v.sellAt) * s.qty)}))}</div>` : "―"}</td>`
      + `<td class="spl">${pl != null ? `<b class="${pl >= 0 ? "gain" : "loss"}">${sgnYen(pl)}</b><div class="note">${esc(stt("plSub", {each: sgnYen(netNow - s.cost), net: yen(netNow)}))}</div>` : "―"}</td>`
      + `<td><span class="sstate">${esc(stt(state))}</span></td>`
      + `<td><button type="button" data-stock-sold="${idx}">${esc(stt("sold"))}</button></td></tr>`;
  }).join("");
  const plSum = nowSum - costSum;
  return `<section class="msec stock">${head}`
    + (sellN ? `<p class="ssell">${esc(stt("sellN", {n: sellN}))}</p>` : "")
    + `<table class="mtbl"><thead><tr><th class="l">${stt("cName")}</th><th>${stt("cQty")}</th><th>${stt("cCost")}</th><th>${stt("cNow")}</th><th>${stt("cTarget")}</th><th>${stt("cPL")}</th><th>${stt("cState")}</th><th></th></tr></thead><tbody>${body}</tbody></table>`
    + `<p class="note">${esc(stt("total", {cost: yen(costSum), now: yen(nowSum), pl: sgnYen(plSum)}))}</p>`
    + (others ? `<p class="note">${esc(stt("otherMode", {n: others}))}</p>` : "")
    + `</section>`;
}

/* ---- 操作（market-ui.js のクリック・変更の受け口から呼ばれる。処理したら true） ---- */
function onStockClick(e){
  const add = e.target.closest("[data-stock-add]");
  if(add){
    const it = DATA && DATA.items.find(x => x.id === add.dataset.stockAdd);
    if(it) stockDialog(it, mkView(it));
    return true;
  }
  const sold = e.target.closest("[data-stock-sold]");
  if(sold){
    const i = +sold.dataset.stockSold, s = stockAll()[i]; if(!s) return true;
    const it = DATA && DATA.items.find(x => x.id === s.id);
    if(confirm(stt("soldAsk", {name: it ? nm(it.name) : s.id}))){ stockSave(stockAll().filter((_, k) => k !== i)); paintMarket(); }
    return true;
  }
  return !!e.target.closest(".stock input");   // 在庫の入力欄のクリックで行を開かない
}
function onStockChange(e){
  const el = e.target, q = el.dataset.stockQty, c = el.dataset.stockCost;
  if(q == null && c == null) return false;
  const list = stockAll().slice(), i = +(q ?? c);
  if(!list[i]) return true;
  list[i] = {...list[i], [q != null ? "qty" : "cost"]: Math.max(1, Math.round(+el.value || 1))};
  stockSave(list); paintMarket();
  return true;
}


setupPage();
applyLang();
if(NEEDS_DATA) loadInitial();
</script>
</body>
</html>
